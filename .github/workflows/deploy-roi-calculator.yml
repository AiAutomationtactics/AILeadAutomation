name: Deploy free educational tools

on:
  push:
    branches: [main]
    paths:
      - 'traffic-roi-calculator.html'
      - 'backlink-quality-worksheet.html'
      - '.github/workflows/deploy-roi-calculator.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "free-roi-pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage only two whitelisted educational pages
        shell: bash
        run: |
          mkdir -p _site
          test -s traffic-roi-calculator.html
          test -s backlink-quality-worksheet.html
          cp traffic-roi-calculator.html _site/index.html
          cp backlink-quality-worksheet.html _site/backlink-quality-worksheet.html
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
