name: Network Index Readiness

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
  push:
    paths:
      - "tools/network_index_monitor.py"
      - "monitor/sites.json"
      - ".github/workflows/network-index-readiness.yml"

permissions:
  contents: read

concurrency:
  group: network-index-readiness
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate monitor
        run: python3 -m py_compile tools/network_index_monitor.py
      - name: Check owner-supplied websites
        run: python3 tools/network_index_monitor.py
      - name: Upload daily CSV Markdown JSON report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: index-readiness-report
          path: reports/index-readiness/
          if-no-files-found: warn
          retention-days: 14
